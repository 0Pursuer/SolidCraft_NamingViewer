<body>
<header class="header"><div class="brand"><div class="logo">SC</div><div><div class="eyebrow">SOLIDCRAFT / TRANSACTION TRACE</div><h1>事务与状态流</h1></div></div><div class="head-actions"><label class="small muted" for="document-select">设计</label><select id="document-select" aria-label="选择设计"></select><button id="refresh-button">刷新</button><a id="recompute-link" class="action" href="/recompute">重算演示</a><a id="archive-link" class="action" href="/archive">原始档案 ↗</a></div></header>
<main class="layout">
<div id="error" class="error" role="alert" hidden></div>
<div class="context"><div class="context-left"><span class="live-dot"></span><span id="view-mode" class="small">正在读取档案</span><span class="badge">根据观察推断操作组</span><span id="current-summary" class="small muted"></span></div><div class="native-counts"><span>原生 Undo<strong id="undo-depth">—</strong></span><span>Redo<strong id="redo-depth">—</strong></span></div></div>
<section class="card" aria-label="操作主线"><div class="section-head"><div class="section-kicker"><span class="step-number">01</span><h2>操作主线</h2></div><div class="small muted">点击节点，展开对象和字段变化</div></div><div class="flow-scroll"><div id="flow-strip" class="flow-strip" role="group" aria-label="Undo、当前位置与Redo链"></div></div><div class="flow-foot"><div class="legend"><span><i></i>已应用</span><span><i class="current"></i>当前位置</span><span><i class="redo"></i>已撤销 · 可恢复</span></div><span id="chain-note"></span></div><div id="boundary" class="boundary" hidden></div></section>
<div class="workspace"><section class="card"><div class="selection-head"><div><div class="small muted" id="selection-meta">操作细节</div><h2 id="selection-title">选择一个操作节点</h2><div class="small muted" id="selection-subtitle"></div></div><div class="selection-tools"><button id="expand-all">全部展开</button><button id="collapse-all">收起</button></div></div><div class="tree-area"><div id="detail-tree"></div><div id="operation-note"></div><details class="evidence" id="evidence"><summary>查看观察依据与原始记录</summary><div id="evidence-body"></div></details></div></section>
<aside class="card side-card"><h3>模型状态</h3><div class="preview-tabs"><button id="preview-before">变更前</button><button id="preview-after" class="active">变更后</button></div><div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 290 200" role="img" aria-label="实体包围盒示意"></svg><div class="diagram-label">包围盒示意 · 精确形状见原始档案</div></div><div class="geometry-metrics" id="geometry-metrics"></div><div class="body-summary" id="body-summary"></div><div id="restore-note" class="restore-note" hidden></div></aside></div>
<section class="card observations"><div class="section-head"><div class="section-kicker"><span class="step-number">02</span><h2>观察时间流</h2></div><span class="small muted">O 为采样记录，不等于内部事务</span></div><div id="event-strip" class="event-strip" aria-label="原始观察顺序"></div></section>
<details class="hidden-group-list" id="other-operations" hidden><summary>查看边界前或分支上已保留的操作</summary><div id="other-operation-list"></div></details>
<footer class="footer"><span>操作组按特征和字段组织；原生内部事务调用树与 Undo/Redo 栈条目未公开。</span><a href="/archive">建模过程档案 · JSON / 三维 / 阶段重建 ↗</a></footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),state={data:null,selection:{kind:'current'},before:null,after:null,preview:'after',documentId:null,selectionEpoch:0,requestEpoch:0,controller:null,timer:null,stopped:false,recordCache:new Map()};
const fmt=n=>typeof n==='number'&&Number.isFinite(n)?new Intl.NumberFormat('zh-CN',{maximumFractionDigits:3}).format(n):'—';
const label=id=>'O'+String(id).padStart(4,'0'),text=v=>v===null?'null':v===undefined?'未提供':typeof v==='string'?v:JSON.stringify(v,null,2),make=(tag,cls,value)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined)el.textContent=String(value);return el;};
const operations=()=>state.data?.operations||[],findOp=id=>operations().find(o=>o.id===id),ids=value=>Array.isArray(value)?value.map(x=>typeof x==='string'?x:x.id):[],depth=n=>Number.isInteger(n)&&n>=0?String(n):'不可获取',geoEmpty=()=>({available:false,body_count:0,bodies:[]});
async function api(path,signal){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);const relay=()=>controller.abort();signal?.addEventListener('abort',relay,{once:true});try{const response=await fetch(path,{credentials:'same-origin',cache:'no-store',signal:controller.signal});if(!response.ok){let message='HTTP '+response.status;try{message=(await response.json()).error||message;}catch{}throw Error(message);}return await response.json();}finally{clearTimeout(timeout);signal?.removeEventListener('abort',relay);}}
function notifyError(error){if(error?.name==='AbortError')return;$('error').textContent=error?.message||String(error);$('error').hidden=false;}
function geoFromInspect(x){const bodies=Array.isArray(x?.bodies)?x.bodies:[],volumes=bodies.map(b=>b.volume_mm3);return {available:true,body_count:bodies.length,bodies:bodies.map(b=>({name:b.name,bbox:b.bbox,volume_mm3:b.volume_mm3,faces:b.kernel?.faces??b.faces,edges:b.kernel?.edges??b.edges})),total_volume_mm3:volumes.every(n=>typeof n==='number'&&Number.isFinite(n))?volumes.reduce((a,b)=>a+b,0):null};}
async function recordInfo(id){if(state.recordCache.has(id))return state.recordCache.get(id);const record=await api('/api/observations/'+id);let geometry=id===state.data?.current?.snapshot_id?state.data.current.geometry:null;const asset=record.assets?.['inspect.json'];if(!geometry&&asset&&asset.size<=2*1024*1024){try{geometry=geoFromInspect(await api('/api/assets/'+asset.sha256));}catch{geometry=geoEmpty();}}const out={record,geometry:geometry||geoEmpty()};if(state.recordCache.size>=12)state.recordCache.delete(state.recordCache.keys().next().value);state.recordCache.set(id,out);return out;}
function height(g){const bodies=g?.bodies||[];if(!bodies.length)return null;let bottom=Infinity,top=-Infinity;for(const b of bodies){const min=b?.bbox?.min,max=b?.bbox?.max;if(!min||!max||min.length!==3||max.length!==3||!min.every(Number.isFinite)||!max.every(Number.isFinite))return null;bottom=Math.min(bottom,min[2]);top=Math.max(top,max[2]);}return top-bottom;}
function currentCaption(){const c=state.data?.current;if(!c)return'尚无一致快照';const h=height(c.geometry);return h!==null&&c.geometry?.body_count===1?fmt(h)+' mm · '+c.label:c.label+' · '+(c.geometry?.body_count??'—')+' 个实体';}
function operationTitle(op){if(op.kind!=='edit_extrude_height')return op.title;const pending=[...(op.tree||[])];while(pending.length){const node=pending.shift();if(node.path?.endsWith('.extent.distance'))return op.title+'\n'+String(node.old).replace(/\s*mm$/,'')+' → '+String(node.new);if(node.children)pending.push(...node.children);}return op.title;}
function addRailNode(title,meta,obs,cls,key,click){const wrap=make('div','node-wrap');if($('flow-strip').childElementCount)wrap.append(make('span','connector'+(cls==='undone'?' redo':'')));const button=make('button','flow-node '+cls+(key===selectedKey()?' selected':''));button.type='button';button.dataset.flowKey=key;button.setAttribute('aria-pressed',String(key===selectedKey()));button.append(make('span','node-title',title),make('span','node-meta',meta),make('span','node-obs',obs));button.onclick=click;wrap.append(button);$('flow-strip').append(wrap);}
function selectedKey(){return state.selection.kind==='operation'?state.selection.id:state.selection.kind==='observation'?'observation-'+state.selection.id:'current';}
function renderRail(){const data=state.data,c=data?.current;$('flow-strip').replaceChildren();if(!c){$('flow-strip').append(make('div','empty','等待取得第一份完整模型快照'));return;}const applied=ids(data.undo_observed),redo=ids(data.redo_observed);if(data.baseline&&((data.baseline.undo_depth??0)>0||!applied.length&&!redo.length)){addRailNode('开始观察时的状态',(data.baseline.undo_depth??0)>0?'既有历史 '+data.baseline.undo_depth+' 步 · 条目未采集':'初始观察',data.baseline.label||'', 'unknown','baseline',()=>select({kind:'observation',id:data.baseline.snapshot_id}));}applied.forEach((id,i)=>{const op=findOp(id);if(op)addRailNode(operationTitle(op),i===applied.length-1?'Undo · 下一步可撤销':'Undo · 已应用',(op.labels||op.observation_ids?.map(label)||[]).join(' · '),'applied',id,()=>select({kind:'operation',id}));});addRailNode(c.is_latest_observation===false?'最近完整状态':'当前位置',c.temporary?'编辑器临时回退':currentCaption(),'revision '+c.revision,'current','current',()=>select({kind:'current'}));redo.slice().reverse().forEach((id,i)=>{const op=findOp(id);if(op)addRailNode(operationTitle(op),i===0?'Redo · 下一步可恢复':'Redo · 已撤销',(op.labels||op.observation_ids?.map(label)||[]).join(' · '),'undone',id,()=>select({kind:'operation',id}));});$('chain-note').textContent='已观察操作 '+applied.length+' 项已应用 / '+redo.length+' 项待恢复';const boundaries=data.boundaries||[];$('boundary').hidden=!boundaries.length;$('boundary').textContent=boundaries.slice(-2).map(b=>b.message||b.label||b.kind).join(' · ');const inRail=new Set(applied.concat(redo)),others=operations().filter(o=>!inRail.has(o.id));$('other-operations').hidden=!others.length;$('other-operation-list').replaceChildren();for(const op of others){const b=make('button','',op.title+' · '+(op.status==='discarded'?'已被新分支替代':'边界外的历史'));b.onclick=()=>select({kind:'operation',id:op.id});$('other-operation-list').append(b);}}
function fieldTitle(node){const value=node.new&&typeof node.new==='object'?node.new:node.old,path=node.path||'',prefix=({added:'新增',removed:'删除',changed:'修改'})[node.change]||'查看';if(value&&typeof value==='object'&&value.id){if(path.includes('.sketch.points['))return prefix+'点 '+value.id;if(path.includes('.sketch.curves['))return prefix+({line:'直线',circle:'圆',arc:'圆弧',spline:'样条'}[value.type]||'曲线')+' '+value.id;if(path.includes('.sketch.constraints['))return prefix+'约束 '+value.id+' · '+({horizontal:'水平',vertical:'垂直',coincident:'重合',parallel:'平行',perpendicular:'垂直',tangent:'相切'}[value.type]||value.type||'约束');}if(path.includes('.sketch.counters.'))return'几何ID计数器 '+path.split('.').at(-1);return node.title||node.name||path||'字段';}
function treeNode(node,level=0){if(node.kind==='field'||!node.children?.length){const item=make('div','field'),head=make('div','field-head');head.append(make('span','field-name',fieldTitle(node)),make('span','node-kind',({added:'新增',removed:'删除',changed:'修改'})[node.change]||'字段'));item.append(head);if(node.path)item.append(make('div','field-path',node.path));const values=make('div','field-values');for(const [key,caption]of [['old','变化前'],['new','变化后']]){const part=make('div');part.append(make('div','value-cap',caption),make('div','value '+key,text(node[key])));values.append(part);if(key==='old')values.append(make('div','arrow','→'));}item.append(values);if(node.truncated)item.append(make('div','small muted','内容已截取；完整值见原始记录'));return item;}const group=make('details','tree-group');group.open=level<1||node.children.length<=2;const summary=make('summary',null,node.title||'对象变化');summary.append(make('span','node-kind',node.children.length+' 项'));group.append(summary);const children=make('div','tree-children');for(const child of node.children)children.append(treeNode(child,level+1));group.append(children);return group;}
function diffTree(diff){const groups=new Map();for(const item of (diff||[]).slice(0,128)){const match=String(item.path||'').match(/^features\[id=([^\]]+)\]/),key=match?'Feature '+match[1]:'文档状态';if(!groups.has(key))groups.set(key,{kind:'group',title:key,children:[]});groups.get(key).children.push({...item,kind:'field',title:item.path==='marker'?'时间线标记 marker':item.path?.endsWith('.extent.distance')?'修改属性 · 拉伸高度':item.path,change:item.kind});}return [...groups.values()];}
function renderTree(title,status,tree){const root=make('div','tree-root'),heading=make('div','tree-root-heading');heading.append(make('strong',null,title),make('span','root-state',status));root.append(heading);const branch=make('div','tree-branch');for(const node of tree||[])branch.append(treeNode(node));if(!branch.childElementCount)branch.append(make('div','empty','此观察没有可比较的字段变化，或属于首次采集。'));root.append(branch);$('detail-tree').replaceChildren(root);}
function setEvidence(lines,observationIds){$('evidence-body').replaceChildren();const list=make('ul');for(const line of lines||[])list.append(make('li',null,typeof line==='string'?line:text(line)));$('evidence-body').append(list);const links=make('div','obs-links');for(const id of observationIds||[]){const a=make('a','obs-link',label(id)+' ↗');a.href='/archive#O'+id;links.append(a);}$('evidence-body').append(links);}
function setOperationNote(message,id){$('operation-note').replaceChildren();if(!message)return;const note=make('div','detail-note',message);if(id){const a=make('a',null,' 查看 '+label(id)+' 原始记录 ↗');a.href='/archive#O'+id;note.append(a);}$('operation-note').append(note);}
function revealSelected(){const button=[...document.querySelectorAll('.flow-node')].find(b=>b.dataset.flowKey===selectedKey()),scroller=document.querySelector('.flow-scroll');if(!button||!scroller)return;const b=button.getBoundingClientRect(),s=scroller.getBoundingClientRect();if(b.left<s.left+8||b.right>s.right-8)scroller.scrollLeft+=b.left-s.left-(s.width-b.width)/2;}
function renderPreview(){const geometry=state.preview==='before'?state.before:state.after;$('preview-before').classList.toggle('active',state.preview==='before');$('preview-after').classList.toggle('active',state.preview==='after');$('geometry-metrics').replaceChildren();const g=geometry||geoEmpty(),h=height(g),values=[['实体',g.available?String(g.body_count??g.bodies?.length??0):'—','个'],[g.body_count===1?'高度':'Z跨度',h===null?'—':fmt(h),'mm'],['体积',g.available?fmt(g.total_volume_mm3):'—','mm³']];for(const [name,value,unit]of values){const m=make('div');m.append(make('div','metric-name',name));const n=make('div','metric-value',value+' ');n.append(make('small',null,unit));m.append(n);$('geometry-metrics').append(m);}$('body-summary').textContent=!g.available?'这一观察没有取得可用的模型摘要。':!g.body_count?'此位置尚无实体；草图数据可在原始档案查看。':g.bodies.map(b=>{const min=b.bbox?.min,max=b.bbox?.max;return b.name+(min&&max?' · '+max.map((n,i)=>fmt(n-min[i])).join(' × ')+' mm':'')+(b.faces!==null&&b.faces!==undefined?' · '+b.faces+'面':'')+(b.edges!==null&&b.edges!==undefined?' '+b.edges+'边':'');}).join('\n');drawDiagram(g);}
function drawDiagram(g){const svg=$('diagram'),width=Math.max(130,svg.clientWidth||290);svg.setAttribute('viewBox','0 0 '+width+' 200');svg.replaceChildren();const NS='http://www.w3.org/2000/svg',add=(tag,attrs,content)=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,String(v));if(content!==undefined)e.textContent=content;svg.append(e);return e;};add('title',{},'来自保存数据的实体包围盒示意');if(!g?.available||!g.body_count){add('text',{x:width/2,y:100,'text-anchor':'middle',fill:'#8392a6','font-size':12},g?.available?'尚无实体':'暂无模型数据');return;}const bodies=g.bodies.slice(0,4),gap=(width-55)/Math.max(1,bodies.length);bodies.forEach((b,index)=>{const min=b.bbox?.min,max=b.bbox?.max;if(!min||!max||!min.every(Number.isFinite)||!max.every(Number.isFinite))return;const dims=max.map((n,i)=>Math.max(.001,n-min[i])),scale=105*Math.min(1,(width-35)/180)/Math.max(...dims),w=dims[0]*scale*.75,d=dims[1]*scale*.5,h=dims[2]*scale;const factor=bodies.length>1?.58:1,cx=width/2+(index-(bodies.length-1)/2)*gap,base=151;const points=[[-w/2,0],[w/2,d*.45],[w/2+d*.55,-d*.1],[-w/2+d*.55,-d*.55]].map(([x,y])=>[cx+x*factor,base+y*factor]);const top=points.map(([x,y])=>[x,y-h*factor]);const face=(ps,fill)=>add('polygon',{points:ps.map(p=>p.join(',')).join(' '),fill,stroke:'#6e94c8','stroke-width':1,'stroke-linejoin':'round'});face([points[0],points[1],top[1],top[0]],'#d3e2fa');face([points[1],points[2],top[2],top[1]],'#b1caec');face(top,'#e8f0fd');if(bodies.length===1)add('text',{x:Math.min(width-24,cx+w/2+d*.55+12),y:base-h*.5,'text-anchor':'middle',fill:'#416b9c','font-size':12},fmt(dims[2])+' mm');add('text',{x:cx,y:184,'text-anchor':'middle',fill:'#718299','font-size':11},String(b.name||''));});}
async function select(selection,{quiet=false}={}){state.selection=selection;if(!quiet)state.preview='after';const epoch=++state.selectionEpoch;renderRail();renderEvents();$('restore-note').hidden=true;if(!quiet)$('evidence').open=false;try{if(selection.kind==='operation'){const op=findOp(selection.id);if(!op){state.selection={kind:'current'};return select(state.selection);}const status=op.status==='undone'?'已提交 · 当前已撤销':op.status==='discarded'?'已被后续分支替代':op.status==='applied'?'已提交 · 当前已应用':'观察推断';$('selection-meta').textContent='操作组 · '+(op.labels||op.observation_ids?.map(label)||[]).join(' / ');$('selection-title').textContent=op.title;$('selection-subtitle').textContent=status+' · 按对象和属性分组';renderTree(op.title,status,op.tree);state.before=op.geometry?.before||geoEmpty();state.after=op.geometry?.after||geoEmpty();setEvidence(op.evidence,op.observation_ids);const notes=[];if(op.observation_ids?.length>1)notes.push('包含编辑器临时回退和最终提交；按一次已观察到的操作展示。');if(op.tree_truncated)notes.push('字段树达到展示预算，仅显示部分变化；完整数据请查看原始记录。');setOperationNote(notes.join(' '),notes.length?op.after_snapshot_id:null);$('archive-link').href='/archive#O'+op.after_snapshot_id;if(op.status==='undone'){$('restore-note').replaceChildren(make('strong',null,'当前已恢复 '+currentCaption()),make('div',null,'这里的“变更后”展示该操作提交时的结果，点击上方蓝色当前位置可查看恢复后的状态。'));$('restore-note').hidden=false;}}
else{const id=selection.kind==='current'?state.data?.current?.snapshot_id:selection.id;if(!id)return;const info=await recordInfo(id);if(epoch!==state.selectionEpoch)return;const r=info.record,s=r.summary||{},isLatest=id===state.data?.current?.snapshot_id,transition=(state.data.transitions||[]).find(t=>t.to_snapshot_id===id),undo=transition?.kind==='undo',redo=transition?.kind==='redo';$('selection-meta').textContent=(isLatest?'当前位置':'原生观察')+' · '+r.label;$('selection-title').textContent=undo?'Undo · 恢复之前的模型':redo?'Redo · 恢复操作结果':s.marker!==null&&isLatest&&state.data.current.temporary?'编辑器临时回退':'模型状态 · '+r.label;$('selection-subtitle').textContent='revision '+s.revision+' · 原生 Undo '+depth(s.undo)+' / Redo '+depth(s.redo);renderTree(undo?'撤销上一次修改':redo?'重新应用操作':'此观察的字段变化','原始字段差异',diffTree(r.diff));let before=geoEmpty();const from=transition?.from_snapshot_id;if(from){try{before=(await recordInfo(from)).geometry;}catch{}}if(epoch!==state.selectionEpoch)return;state.after=info.geometry;state.before=before;setEvidence((r.inference?.evidence||[]).concat(['这里只读查看历史观察；点击节点不会向 SolidCraft 发送 Undo 或 Redo。']),[id]);setOperationNote(undo?'模型内容已恢复，revision仍继续前进；Undo/Redo具体栈条目由原生接口保留。':s.marker!==null?'该观察停在时间线前缀 '+s.marker+'；标记之后的特征尚未执行。':'这里显示完整时间线末尾的模型。',id);$('archive-link').href='/archive#O'+id;}
const selectedTransition=(state.data.transitions||[]).find(t=>t.to_snapshot_id===(selection.kind==='current'?state.data.current?.snapshot_id:selection.id));const recomputeOp=selection.kind==='operation'?findOp(selection.id):findOp(selectedTransition?.operation_ids?.[0]);$('recompute-link').href=recomputeOp?.before_snapshot_id&&recomputeOp?.after_snapshot_id?'/recompute#before='+recomputeOp.before_snapshot_id+'&after='+recomputeOp.after_snapshot_id:'/recompute';renderPreview();if(!quiet)revealSelected();}catch(error){if(epoch===state.selectionEpoch)notifyError(error);}}
function renderEvents(){const box=$('event-strip');box.replaceChildren();const selectedIds=state.selection.kind==='operation'?findOp(state.selection.id)?.observation_ids||[]:[state.selection.kind==='current'?state.data?.current?.snapshot_id:state.selection.id];for(const event of state.data?.events||[]){const id=event.id,button=make('button','event'+(selectedIds.includes(id)?' selected':'')+(event.snapshot_id?'':' gap'));button.append(make('strong',null,event.label||label(id)),make('span',null,event.status==='committed'?'已取得快照':event.status||event.kind||'通知'));button.onclick=()=>event.snapshot_id?select({kind:'observation',id}):notifyError({message:event.message||'此通知没有取得一致快照，不能展示模型。'});box.append(button);}if(!box.childElementCount)box.append(make('div','empty','尚无观察记录'));}
function renderHeader(){const d=state.data,c=d?.current;$('view-mode').textContent=d.view_mode==='read_only'?'只读流程视图 · 档案自动更新':d.view_mode==='recorder'?'记录器已连接 · 操作流自动更新':'离线档案 · 操作流';$('current-summary').textContent=c?c.label+' · revision '+c.revision+(c.is_latest_observation===false?' · 新通知尚未取得完整快照':''):'等待完整快照';$('undo-depth').textContent=depth(c?.undo_depth);$('redo-depth').textContent=depth(c?.redo_depth);const select=$('document-select'),old=state.documentId;select.replaceChildren();for(const doc of d.documents||[]){const option=make('option',null,(doc.name||'未命名设计')+' · '+(doc.id||doc.document_id||'').slice(-5));option.value=doc.id||doc.document_id;select.append(option);}select.value=d.document_id||old||'';state.documentId=d.document_id||old;}
async function load({reset=false}={}){const epoch=++state.requestEpoch;state.controller?.abort();const controller=new AbortController();state.controller=controller;try{const suffix=state.documentId?'?document_id='+encodeURIComponent(state.documentId):'';const data=await api('/api/flow'+suffix,controller.signal);if(epoch!==state.requestEpoch)return;const previousId=state.data?.document_id,previousCurrent=state.data?.current?.snapshot_id,previousStatus=findOp(state.selection.id)?.status;state.data=data;$('error').hidden=true;renderHeader();renderRail();renderEvents();if(reset||previousId!==data.document_id){state.selection={kind:'current'};state.recordCache.clear();await select(state.selection);}else if(previousCurrent!==data.current?.snapshot_id||previousStatus!==findOp(state.selection.id)?.status){await select(state.selection,{quiet:true});}else if(!state.after)await select(state.selection);}catch(error){if(epoch===state.requestEpoch)notifyError(error);}finally{if(epoch===state.requestEpoch&&!state.stopped){clearTimeout(state.timer);state.timer=setTimeout(()=>load(),document.hidden?8000:2000);}}}
$('document-select').onchange=()=>{state.documentId=$('document-select').value;state.selectionEpoch++;state.recordCache.clear();load({reset:true});};$('refresh-button').onclick=()=>load();$('expand-all').onclick=()=>document.querySelectorAll('#detail-tree details').forEach(e=>e.open=true);$('collapse-all').onclick=()=>document.querySelectorAll('#detail-tree details').forEach(e=>e.open=false);$('preview-before').onclick=()=>{state.preview='before';renderPreview();};$('preview-after').onclick=()=>{state.preview='after';renderPreview();};const observer=new ResizeObserver(()=>drawDiagram(state.preview==='before'?state.before:state.after));observer.observe($('diagram'));window.addEventListener('beforeunload',()=>{state.stopped=true;clearTimeout(state.timer);state.controller?.abort();observer.disconnect();});window.__traceFlow={state,select,load,renderPreview};load();
